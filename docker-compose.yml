# Локальное окружение для разработки.
# Само приложение запускается на хосте (`npm run start:dev`), а здесь — только
# внешние зависимости, которые в проде были бы отдельными управляемыми сервисами.
#
#   docker compose up -d      — поднять всё
#   docker compose down       — остановить (данные в volumes сохраняются)
#   docker compose down -v    — остановить и удалить данные
services:
  # Основная реляционная БД приложения.
  postgres:
    image: postgres:18-alpine
    container_name: mnt-postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      # Скрипты из этой папки Postgres выполняет один раз — при первом создании
      # volume. Там создаётся отдельная БД для e2e-тестов.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # S3-совместимое хранилище добавим на шаге 1.4 (публичные образы MinIO
  # перестали распространяться через Docker Hub — выберем альтернативу тогда).

  # Mailpit — «фальшивый» SMTP-сервер. Принимает все письма приложения и
  # никуда их не отправляет, а показывает в веб-интерфейсе http://localhost:8025.
  # Так можно проверять письма с OTP-кодами и magic link, не имея реальной почты.
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: mnt-mailpit
    ports:
      - "${SMTP_PORT}:1025" # SMTP — сюда стучится Nodemailer
      - "8025:8025"         # веб-интерфейс для просмотра писем

volumes:
  postgres_data:
    driver: local
